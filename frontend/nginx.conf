server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # The API limits the file to 25 MiB; multipart boundaries/headers need extra room.
    client_max_body_size 26m;

    # Same-origin API routing works without a separate gateway or a per-environment JS build.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
